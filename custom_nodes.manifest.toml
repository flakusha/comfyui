# Declarative pins for the custom_nodes/* git checkouts, consumed by
#   python scripts/custom_nodes_deps.py sync
# The fork's tooling owns cloning and ref pinning for these nodes; this
# replaces ComfyUI-Manager's install/update behavior, which stays out of the
# loop for manifest-managed nodes. Once every node under custom_nodes/ is
# listed here as a git clone, the "manager" extra in pyproject.toml can be
# dropped (deliberately left in place for now).
#
# Format: one [nodes.<directory-name>] table per node.
#   url  clone URL; the tool clones it as custom_nodes/<name> with remote
#        "origin" (fetch/pull always go through origin)
#   ref  what to check out, one of:
#     latest     HEAD of origin's default branch at fetch time.
#                Chosen over "newest tag" deliberately: most of these node
#                repos rarely cut tags, so a tag-based latest would pin most
#                nodes to stale or nonexistent tags. Resolution is still
#                deterministic per fetch and recorded — sync echoes the full
#                resolved hash for every node, and each clone's HEAD is that
#                record. Pin a tag/hash when a node needs stability.
#     master     a branch name: tracks origin/<branch> at fetch time; the
#                local branch is fast-forwarded to it (diverged local commits
#                are refused, never discarded)
#     v1.2.3     a tag: detached checkout at the tagged commit (tags win over
#                same-named branches)
#     1a2b3c4d   a commit hash, 7-40 hex chars: detached checkout
#     HEAD~5     N commits behind the remote default branch's HEAD at fetch
#                time (resolved against origin's refs, never local state):
#                detached checkout
#   extras optional list of the node's pyproject.toml
#        [project.optional-dependencies] group names to install — the
#        custom-node equivalent of uv's --extra, since `uv sync` cannot
#        enable a workspace member's extras. Names match PEP 503-normalized
#        (doc_export honors doc-export); an extra the node's pyproject does
#        not define is a hard error at audit/install time, never silently
#        skipped. Extras take effect once the node is cloned — update_local.py
#        syncs before installing, so a fresh checkout is covered in one run.
#   patches optional ordered list of plain patch file names, relative to
#        custom_nodes_patches/<directory-name>/ at the repo root (one
#        subdirectory per node, mirroring the [nodes.<name>] key). Carries
#        LOCAL changes on top of the pinned ref without local commits: each
#        file is a plain `git format-diff`-style diff applied with `git apply`
#        after the pinned ref is checked out (apply, not am — patches stay
#        simple, committable-by-hand diffs that are trivial to regenerate
#        against a moved ref). Applied in list order; a patch that fails —
#        missing file, or a hunk upstream changed — is a loud error naming
#        the node and patch file, never a silent skip. Idempotence model:
#        on every sync the worktree must match either the clean pinned ref
#        (then the stack is applied) or the ref with the full stack already
#        applied (reverse-apply check; no re-apply) — any OTHER dirty state
#        is refused loudly, never discarded, and a ref move under an applied
#        stack resets it first and re-applies after convergence. Patchless
#        nodes keep the plain dirty-worktree refusal unchanged.
#   patches_base optional commit hash (7-40 lowercase hex, or the literal
#        "unknown") recording the upstream commit this node's patch stack
#        was last known-good on. Written by the tooling, not by hand:
#        `python scripts/custom_nodes_deps.py sync --stamp-patches-base
#        <node>` settles the node at its pinned ref with the stack applied
#        and stamps the resolved SHA here (re-run it after moving a ref to
#        re-stamp deliberately). At sync time a base that differs from the
#        resolved ref is a WARNING naming both SHAs — drift is expected
#        (patches apply fine across nearby commits; git apply validates the
#        hunks against whatever tree they land on) — never a refusal; the
#        base exists so a future ref move starts from a known-good point
#        instead of guesswork. Requires patches. Pre-existing stacks whose
#        original base was never recorded stay without the field (absent =
#        silent); "unknown" is the explicit form of the same admission.
#
# Behavior: an existing clone already at the pinned ref is left untouched;
# a wrong ref is fetched and checked out; a dirty worktree (uncommitted
# changes to tracked files) is refused loudly, never discarded; a directory
# that exists but is not a git clone is refused with a takeover hint.
#
# Ref changes affect what the [tool.uv.workspace] members (custom_nodes/*,
# minus comfyui-impact-pack) resolve into uv.lock; update_local.py step 5
# runs sync followed by the dependency install for exactly this reason.

