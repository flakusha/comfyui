# Declarative pins for the custom_nodes/* git checkouts, consumed by
#   python scripts/custom_nodes_deps.py sync
# The fork's tooling owns cloning and ref pinning for these nodes; this
# replaces ComfyUI-Manager's install/update behavior, which stays out of the
# loop for manifest-managed nodes. Once every node under custom_nodes/ is
# listed here as a git clone, the "manager" extra in pyproject.toml can be
# dropped (deliberately left in place for now).
#
# Format: one [nodes.<directory-name>] table per node.
#   url  clone URL; the tool clones it as custom_nodes/<name> with remote
#        "origin" (fetch/pull always go through origin)
#   ref  what to check out, one of:
#     latest     HEAD of origin's default branch at fetch time.
#                Chosen over "newest tag" deliberately: most of these node
#                repos rarely cut tags, so a tag-based latest would pin most
#                nodes to stale or nonexistent tags. Resolution is still
#                deterministic per fetch and recorded — sync echoes the full
#                resolved hash for every node, and each clone's HEAD is that
#                record. Pin a tag/hash when a node needs stability.
#     master     a branch name: tracks origin/<branch> at fetch time; the
#                local branch is fast-forwarded to it (diverged local commits
#                are refused, never discarded)
#     v1.2.3     a tag: detached checkout at the tagged commit (tags win over
#                same-named branches)
#     1a2b3c4d   a commit hash, 7-40 hex chars: detached checkout
#     HEAD~5     N commits behind the remote default branch's HEAD at fetch
#                time (resolved against origin's refs, never local state):
#                detached checkout
#
# Behavior: an existing clone already at the pinned ref is left untouched;
# a wrong ref is fetched and checked out; a dirty worktree (uncommitted
# changes to tracked files) is refused loudly, never discarded; a directory
# that exists but is not a git clone is refused with a takeover hint.
#
# Ref changes affect what the [tool.uv.workspace] members (custom_nodes/*,
# minus comfyui-impact-pack) resolve into uv.lock; update_local.py step 5
# runs sync followed by the dependency install for exactly this reason.

[nodes.ComfyUI-ClipProj]
